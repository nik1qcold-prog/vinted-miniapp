<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vinted Monitor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-elevated: #f0f0f2;
      --text: #111111;
      --text-secondary: #6e6e73;
      --border: #e5e5ea;
      --accent: #111111;
      --accent-text: #ffffff;
      --chip-bg: #f2f2f7;
      --chip-active-bg: #111111;
      --chip-active-text: #ffffff;
      --danger: #ff3b30;
      --success: #34c759;
      --radius-lg: 16px;
      --radius-md: 12px;
      --radius-pill: 999px;
    }

    html.dark {
      --bg: #0d0d0d;
      --surface: #171717;
      --surface-elevated: #222222;
      --text: #f5f5f7;
      --text-secondary: #8e8e93;
      --border: #262626;
      --accent: #ffffff;
      --accent-text: #0d0d0d;
      --chip-bg: #222222;
      --chip-active-bg: #ffffff;
      --chip-active-text: #0d0d0d;
      --danger: #ff453a;
      --success: #30d158;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
      padding-bottom: 92px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header-title {
      font-size: 22px;
      font-weight: 700;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 600;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: var(--success);
    }

    .status-dot.paused {
      background-color: var(--text-secondary);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 600;
      padding: 8px 4px;
      border-radius: 9px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
    }

    .add-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius-pill);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .filter-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 12px;
    }

    .filter-card.inactive {
      opacity: 0.55;
    }

    .filter-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .filter-brand {
      font-size: 17px;
      font-weight: 700;
    }

    .filter-cat {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .filter-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .meta-badge {
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .filter-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
    }

    .delete-btn:hover {
      color: var(--danger);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 26px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: var(--surface-elevated);
      border: 1px solid var(--border);
      transition: 0.2s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-secondary);
      transition: 0.2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
      background-color: var(--accent-text);
    }

    .feed-filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 10px;
    }

    .feed-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .feed-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .feed-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .feed-right {
      text-align: right;
      flex-shrink: 0;
    }

    .feed-price {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .link-btn {
      display: inline-block;
      text-decoration: none;
      background: var(--surface-elevated);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
    }

    .settings-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-row:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .setting-row:first-child {
      padding-top: 0;
    }

    .setting-title {
      font-size: 15px;
      font-weight: 500;
    }

    .setting-desc {
      font-size: 12px;
      color: var(--text-secondary);
    }

    select.minimal-select {
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .sheet {
      background: var(--surface);
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 14px 18px 28px;
      border-top: 1px solid var(--border);
      max-height: 90vh;
      overflow-y: auto;
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      margin: 0 auto 14px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .sheet-title {
      font-size: 18px;
      font-weight: 700;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 24px;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-label span.opt {
      font-weight: 400;
      text-transform: none;
    }

    .text-input {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .chip {
      background: var(--chip-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .chip.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-text);
      border-color: var(--chip-active-bg);
      font-weight: 600;
    }

    .error-msg {
      color: var(--danger);
      font-size: 13px;
      margin-bottom: 12px;
      display: none;
    }

    .primary-btn {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .footer-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      z-index: 50;
    }

    .footer-inner {
      max-width: 480px;
      margin: 0 auto;
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      color: var(--text-secondary);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-title">Vinted Monitor</div>
      <div class="status-pill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Активно • 2</span>
      </div>
    </div>

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="filters">Фильтры</button>
      <button type="button" class="tab-btn" data-tab="feed">Лента</button>
      <button type="button" class="tab-btn" data-tab="settings">Настройки</button>
    </div>

    <div class="section active" id="tab-filters">
      <div class="section-header">
        <span class="section-label">Мои фильтры</span>
        <button type="button" class="add-btn" id="openModalBtn">+ Добавить</button>
      </div>
      <div id="filtersList"></div>
    </div>

    <div class="section" id="tab-feed">
      <div class="feed-filters" id="feedFilterChips"></div>
      <div id="feedList"></div>
    </div>

    <div class="section" id="tab-settings">
      <div class="settings-card">
        <div class="setting-row">
          <div>
            <div class="setting-title">Интервал проверки</div>
            <div class="setting-desc">Как часто бот сканирует Vinted.pl</div>
          </div>
          <select class="minimal-select" id="intervalSelect">
            <option value="30">30 сек</option>
            <option value="60" selected>1 мин</option>
            <option value="180">3 мин</option>
            <option value="300">5 мин</option>
          </select>
        </div>

        <div class="setting-row">
          <div>
            <div class="setting-title">Беззвучные уведомления</div>
            <div class="setting-desc">Отправлять находки без звука</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="silentToggle" />
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <div>
            <div class="setting-title">Тёмная тема</div>
            <div class="setting-desc">Минималистичный ночной режим</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="themeToggle" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="footer-inner">
      <button type="button" class="primary-btn" id="syncBtn">Сохранить и отправить боту</button>
    </div>
  </div>

  <div class="modal-backdrop" id="filterModal">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <div class="sheet-title">Новый фильтр</div>
        <button type="button" class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <div class="form-group">
        <label class="form-label">Бренд / запрос</label>
        <input type="text" class="text-input" id="brandInput" placeholder="Например: Nike или Rolling Stones" />
        <div class="chips-wrap" id="brandChips">
          <button type="button" class="chip" data-val="Nike">Nike</button>
          <button type="button" class="chip" data-val="Carhartt">Carhartt</button>
          <button type="button" class="chip" data-val="Adidas">Adidas</button>
          <button type="button" class="chip" data-val="Ralph Lauren">Ralph Lauren</button>
          <button type="button" class="chip" data-val="Stone Island">Stone Island</button>
          <button type="button" class="chip" data-val="Stussy">Stussy</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Категория <span class="opt">(необязательно)</span></label>
        <input type="text" class="text-input" id="categoryInput" placeholder="Любая категория (или введите: Кофта)" />
        <div class="chips-wrap" id="categoryChips">
          <button type="button" class="chip" data-val="Кофта">Кофта</button>
          <button type="button" class="chip" data-val="Куртка">Куртка</button>
          <button type="button" class="chip" data-val="Сумка">Сумка</button>
          <button type="button" class="chip" data-val="Кроссовки">Кроссовки</button>
          <button type="button" class="chip" data-val="Джинсы">Джинсы</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Размер</label>
        <div class="chips-wrap" id="sizeChips" style="margin-top: 0;">
          <button type="button" class="chip" data-size="XS">XS</button>
          <button type="button" class="chip" data-size="S">S</button>
          <button type="button" class="chip" data-size="M">M</button>
          <button type="button" class="chip" data-size="L">L</button>
          <button type="button" class="chip" data-size="XL">XL</button>
          <button type="button" class="chip active" data-size="ANY">Любой</button>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Максимальная цена (PLN)</label>
        <input type="number" class="text-input" id="priceInput" placeholder="Например: 150" min="1" />
      </div>

      <div class="form-group">
        <label class="form-label">Состояние</label>
        <div class="chips-wrap" id="conditionChips" style="margin-top: 0;">
          <button type="button" class="chip active" data-cond="Любое">Любое</button>
          <button type="button" class="chip" data-cond="Новое">Новое</button>
          <button type="button" class="chip" data-cond="Отличное">Отличное</button>
          <button type="button" class="chip" data-cond="Хорошее">Хорошее</button>
        </div>
      </div>

      <div class="error-msg" id="formError"></div>
      <button type="button" class="primary-btn" id="createFilterBtn">Создать фильтр</button>
    </div>
  </div>

  <script>
    (function () {
      const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
      if (tg) {
        tg.ready();
        tg.expand();
      }

      const STORAGE_KEY = "vinted_monitor_state_clean_v1";

      const defaultState = {
        filters: [
          {
            id: 1,
            brand: "Nike",
            category: "Кофта",
            sizes: ["M", "L"],
            max_price: 120,
            condition: "Отличное",
            active: true
          },
          {
            id: 2,
            brand: "Carhartt",
            category: "",
            sizes: [],
            max_price: 180,
            condition: "Любое",
            active: true
          }
        ],
        settings: {
          interval: 60,
          silent: false,
          dark: true
        }
      };

      const mockFeed = [
        { id: 101, brand: "Nike", title: "Nike Vintage Center Swoosh Hoodie", size: "L", price: 95, time: "2 мин назад", url: "https://www.vinted.pl" },
        { id: 102, brand: "Carhartt", title: "Carhartt WIP Kickflip Backpack Black", size: "One Size", price: 140, time: "11 мин назад", url: "https://www.vinted.pl" },
        { id: 103, brand: "Nike", title: "Nike Tech Fleece Zip Hoodie Grey", size: "M", price: 115, time: "24 мин назад", url: "https://www.vinted.pl" }
      ];

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && Array.isArray(parsed.filters) && parsed.settings) {
              return parsed;
            }
          }
        } catch (e) {}
        return JSON.parse(JSON.stringify(defaultState));
      }

      let state = loadState();
      let selectedFeedBrand = "ALL";

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function applyTheme() {
        const isDark = !!state.settings.dark;
        document.documentElement.classList.toggle("dark", isDark);
        document.getElementById("themeToggle").checked = isDark;
      }

      function updateStatusHeader() {
        const activeCount = state.filters.filter(f => f.active).length;
        const dot = document.getElementById("statusDot");
        const text = document.getElementById("statusText");
        if (activeCount > 0) {
          dot.classList.remove("paused");
          text.textContent = "Активно • " + activeCount;
        } else {
          dot.classList.add("paused");
          text.textContent = "На паузе";
        }
      }

      function renderFilters() {
        const list = document.getElementById("filtersList");
        updateStatusHeader();

        if (!state.filters.length) {
          list.innerHTML = '<div class="empty-state">Нет добавленных фильтров.<br>Нажмите «+ Добавить», чтобы начать мониторинг.</div>';
          return;
        }

        list.innerHTML = state.filters.map(f => {
          const catText = f.category && f.category.trim() ? f.category.trim() : "Любая категория";
          const sizeText = f.sizes && f.sizes.length ? "Размер: " + f.sizes.join(", ") : "Любой размер";
          const condBadge = f.condition && f.condition !== "Любое"
            ? '<span class="meta-badge">' + esc(f.condition) + "</span>"
            : "";

          return (
            '<div class="filter-card ' + (f.active ? "" : "inactive") + '">' +
              '<div class="filter-top">' +
                '<div>' +
                  '<div class="filter-brand">' + esc(f.brand) + "</div>" +
                  '<div class="filter-cat">' + esc(catText) + "</div>" +
                "</div>" +
                '<div class="filter-actions">' +
                  '<label class="switch">' +
                    '<input type="checkbox" data-toggle-id="' + f.id + '" ' + (f.active ? "checked" : "") + ">" +
                    '<span class="slider"></span>' +
                  "</label>" +
                  '<button type="button" class="delete-btn" data-del-id="' + f.id + '" title="Удалить">&times;</button>' +
                "</div>" +
              "</div>" +
              '<div class="filter-meta">' +
                '<span class="meta-badge">до ' + esc(f.max_price) + " PLN</span>" +
                '<span class="meta-badge">' + esc(sizeText) + "</span>" +
                condBadge +
              "</div>" +
            "</div>"
          );
        }).join("");

        list.querySelectorAll("[data-toggle-id]").forEach(el => {
          el.addEventListener("change", () => {
            const id = Number(el.getAttribute("data-toggle-id"));
            const item = state.filters.find(x => x.id === id);
            if (item) {
              item.active = el.checked;
              saveState();
              renderFilters();
            }
          });
        });

        list.querySelectorAll("[data-del-id]").forEach(el => {
          el.addEventListener("click", () => {
            const id = Number(el.getAttribute("data-del-id"));
            state.filters = state.filters.filter(x => x.id !== id);
            saveState();
            renderFilters();
            renderFeed();
          });
        });
      }

      function renderFeed() {
        const chipsBox = document.getElementById("feedFilterChips");
        const feedBox = document.getElementById("feedList");
        const brands = ["ALL"].concat(Array.from(new Set(state.filters.map(f => f.brand))));

        chipsBox.innerHTML = brands.map(b => {
          const isAct = selectedFeedBrand === b;
          const label = b === "ALL" ? "Все" : b;
          return '<button type="button" class="chip ' + (isAct ? "active" : "") + '" data-feed-brand="' + esc(b) + '">' + esc(label) + "</button>";
        }).join("");

        chipsBox.querySelectorAll("[data-feed-brand]").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedFeedBrand = btn.getAttribute("data-feed-brand");
            renderFeed();
          });
        });

        const items = selectedFeedBrand === "ALL"
          ? mockFeed
          : mockFeed.filter(x => x.brand.toLowerCase() === selectedFeedBrand.toLowerCase());

        if (!items.length) {
          feedBox.innerHTML = '<div class="empty-state">Пока нет находок по выбранному бренду.</div>';
          return;
        }

        feedBox.innerHTML = items.map(item => (
          '<div class="feed-card">' +
            "<div>" +
              '<div class="feed-title">' + esc(item.title) + "</div>" +
              '<div class="feed-sub">' + esc(item.brand) + " • Размер " + esc(item.size) + " • " + esc(item.time) + "</div>" +
            "</div>" +
            '<div class="feed-right">' +
              '<div class="feed-price">' + esc(item.price) + " PLN</div>" +
              '<a href="' + esc(item.url) + '" target="_blank" rel="noopener noreferrer" class="link-btn">Vinted ↗</a>' +
            "</div>" +
          "</div>"
        )).join("");
      }

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const tabName = btn.getAttribute("data-tab");
          document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("tab-" + tabName).classList.add("active");
        });
      });

      const modal = document.getElementById("filterModal");
      const errorEl = document.getElementById("formError");

      document.getElementById("openModalBtn").addEventListener("click", () => {
        document.getElementById("brandInput").value = "";
        document.getElementById("categoryInput").value = "";
        document.getElementById("priceInput").value = "";
        errorEl.style.display = "none";

        document.querySelectorAll("#brandChips .chip, #categoryChips .chip").forEach(c => c.classList.remove("active"));
        document.querySelectorAll("#sizeChips .chip").forEach(c => c.classList.toggle("active", c.getAttribute("data-size") === "ANY"));
        document.querySelectorAll("#conditionChips .chip").forEach(c => c.classList.toggle("active", c.getAttribute("data-cond") === "Любое"));

        modal.classList.add("open");
      });

      document.getElementById("closeModalBtn").addEventListener("click", () => {
        modal.classList.remove("open");
      });

      modal.addEventListener("click", e => {
        if (e.target === modal) modal.classList.remove("open");
      });

      document.querySelectorAll("#brandChips .chip").forEach(chip => {
        chip.addEventListener("click", () => {
          document.getElementById("brandInput").value = chip.getAttribute("data-val");
          document.querySelectorAll("#brandChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
        });
      });

      document.querySelectorAll("#categoryChips .chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const input = document.getElementById("categoryInput");
          if (chip.classList.contains("active")) {
            chip.classList.remove("active");
            input.value = "";
          } else {
            document.querySelectorAll("#categoryChips .chip").forEach(c => c.classList.remove("active"));
            chip.classList.add("active");
            input.value = chip.getAttribute("data-val");
          }
        });
      });

      document.querySelectorAll("#sizeChips .chip").forEach(chip => {
        chip.addEventListener("click", () => {
          const size = chip.getAttribute("data-size");
          const anyChip = document.querySelector('#sizeChips .chip[data-size="ANY"]');
          if (size === "ANY") {
            document.querySelectorAll("#sizeChips .chip").forEach(c => c.classList.remove("active"));
            anyChip.classList.add("active");
          } else {
            anyChip.classList.remove("active");
            chip.classList.toggle("active");
            const hasAny = document.querySelectorAll("#sizeChips .chip.active").length > 0;
            if (!hasAny) anyChip.classList.add("active");
          }
        });
      });

      document.querySelectorAll("#conditionChips .chip").forEach(chip => {
        chip.addEventListener("click", () => {
          document.querySelectorAll("#conditionChips .chip").forEach(c => c.classList.remove("active"));
          chip.classList.add("active");
        });
      });

      document.getElementById("createFilterBtn").addEventListener("click", () => {
        const brand = document.getElementById("brandInput").value.trim();
        const category = document.getElementById("categoryInput").value.trim();
        const maxPrice = Number(document.getElementById("priceInput").value);

        if (!brand) {
          errorEl.textContent = "Укажите бренд или поисковый запрос.";
          errorEl.style.display = "block";
          return;
        }

        if (!maxPrice || maxPrice <= 0) {
          errorEl.textContent = "Укажите максимальную цену в PLN.";
          errorEl.style.display = "block";
          return;
        }

        const sizes = Array.from(document.querySelectorAll("#sizeChips .chip.active"))
          .map(c => c.getAttribute("data-size"))
          .filter(s => s && s !== "ANY");

        const activeCondEl = document.querySelector("#conditionChips .chip.active");
        const condition = activeCondEl ? activeCondEl.getAttribute("data-cond") : "Любое";

        state.filters.unshift({
          id: Date.now(),
          brand: brand,
          category: category,
          sizes: sizes,
          max_price: maxPrice,
          condition: condition,
          active: true
        });

        saveState();
        renderFilters();
        renderFeed();
        modal.classList.remove("open");
      });

      document.getElementById("intervalSelect").value = String(state.settings.interval || 60);
      document.getElementById("silentToggle").checked = !!state.settings.silent;

      document.getElementById("intervalSelect").addEventListener("change", e => {
        state.settings.interval = Number(e.target.value);
        saveState();
      });

      document.getElementById("silentToggle").addEventListener("change", e => {
        state.settings.silent = e.target.checked;
        saveState();
      });

      document.getElementById("themeToggle").addEventListener("change", e => {
        state.settings.dark = e.target.checked;
        applyTheme();
        saveState();
      });

      document.getElementById("syncBtn").addEventListener("click", () => {
        const payload = JSON.stringify({
          filters: state.filters,
          settings: state.settings
        });

        if (tg && typeof tg.sendData === "function") {
          tg.sendData(payload);
        } else {
          window.prompt("JSON готов к отправке боту (скопируйте):", payload);
        }
      });

      applyTheme();
      renderFilters();
      renderFeed();
    })();
  </script>
</body>
</html>
